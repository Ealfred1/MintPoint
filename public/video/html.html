<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Page title -->
    <title>Jessica Randall - Social Links Profile</title>
    
    <!-- Google Fonts - Inter font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

        </div>
        
        <!-- Profile information section -->
        <div class="profile-info">
            <!-- User's full name -->
            <h1 class="profile-name">Jessica Randall</h1>
            
            <!-- User's location -->
            <p class="profile-location">London, United Kingdom</p>
            
            <!-- User's bio/description -->
            <p class="profile-description">"Front-end developer and avid reader."</p>

            <!-- Frontend Mentor profile link -->
            <a href="#" class="social-link" 
               aria-label="Visit Jessica's Frontend Mentor profile">

            </a>
            
            <!-- LinkedIn profile link -->
            <a href="#" class="social-link" 
               aria-label="Visit Jessica's LinkedIn profile">
                LinkedIn
            </a>
            
            <!-- Twitter profile link -->
            <a href="#" class="social-link" 
               aria-label="Visit Jessica's Twitter profile">
                Twitter
            </a>
            
            <!-- Instagram profile link -->
            <a href="#" class="social-link" 
               aria-label="Visit Jessica's Instagram profile">
                Instagram
            </a>
        </nav>
    </main>
</body>
</html>
